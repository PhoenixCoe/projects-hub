name: Deploy Projects Hub to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hub Repo
        uses: actions/checkout@v4

      - name: Checkout Alumni
        uses: actions/checkout@v4
        with:
          repository: PhoenixCoe/alumni
          path: alumni

      - name: Checkout Student Page
        uses: actions/checkout@v4
        with:
          repository: PhoenixCoe/studentpage
          path: studentpage

      - name: Checkout Revision Hub
        uses: actions/checkout@v4
        with:
          repository: PhoenixCoe/revision-hub
          path: revisionhub

      - name: Fetch 404 Page from Main Site
        run: |
          curl -sL https://pmcstudios.uk/404 -o 404.html || echo "<h1>404 - Page Not Found</h1>" > 404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
