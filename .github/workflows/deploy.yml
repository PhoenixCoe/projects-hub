name: Deploy Projects Hub to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hub Repo
        uses: actions/checkout@v4

      - name: Checkout Alumni
        uses: actions/checkout@v4
        with:
          repository: PhoenixCoe/alumni
          path: alumni

      - name: Checkout Student Page
        uses: actions/checkout@v4
        with:
          repository: PhoenixCoe/studentpage
          path: studentpage

      - name: Checkout Revision Hub
        uses: actions/checkout@v4
        with:
          repository: PhoenixCoe/revision-hub
          path: revision-hub

      - name: Create 404 Redirect Page
        run: |
          cat << 'EOF' > 404.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://pmcstudios.uk/404">
            <script>window.location.href = "https://pmcstudios.uk/404";</script>
            <title>Page Not Found</title>
          </head>
          <body>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
